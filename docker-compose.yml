version: '3'
services:
  nginx:
    image: nginx:1.19.2-alpine
    container_name: training-web
    ports:
      - 58889:80
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - php

  php:
    build: ./docker/php
    container_name: training-php
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: training-db
    ports:
      - 55336:3306
    volumes:
      - "db-store:/var/lib/mysql"
      - "./docker/db/conf:/etc/mysql"
      - "./docker/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udemy
      MYSQL_USER: keisuke
      MYSQL_PASSWORD: keisuke
    platform: "linux/x86_64"

  phpmyadmin:
      image: phpmyadmin/phpmyadmin:latest
      container_name: training-phpmyadmin
      environment:
        - PMA_ARBITRARY=1
        - PMA_USER=root
        - PMA_PASSWORD=changeme
      links:
        - db
      ports:
        - 58888:80
      depends_on:
        - db

volumes:
  db-store: